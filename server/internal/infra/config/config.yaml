# Cognos 后端配置文件
#
# 本地开发使用默认值，Docker 环境通过环境变量覆盖。
# 环境变量前缀：COGNOS_，例如 COGNOS_DATABASE_HOST 覆盖 database.host。

server:
  port: 8080
  mode: debug  # debug / release
  read_timeout: 15s
  write_timeout: 300s
  idle_timeout: 60s

database:
  host: localhost        # Docker 内: postgres
  port: 5432
  user: cognos
  password: "cognos_dev"  # 通过环境变量 COGNOS_DATABASE_PASSWORD 覆盖
  dbname: cognos
  sslmode: disable
  max_open_conns: 0    # 0 = 不限，由 PostgreSQL max_connections 控制
  max_idle_conns: 0    # 0 = 不限
  conn_max_lifetime: 5m

jwt:
  secret: ""             # 通过环境变量 COGNOS_JWT_SECRET 设置
  access_expire: 2h
  refresh_expire: 168h   # 7 天

storage:
  driver: local              # local | minio
  local:
    base_dir: ./data/storage  # 本地存储根目录
  minio:
    endpoint: localhost:9000  # Docker 内: minio:9000
    access_key: minioadmin
    secret_key: minioadmin
    use_ssl: false
  buckets:
    documents: cognos-documents   # 单桶；草稿/已发布由目录区分（kb-{id}/{draft|published}/article-{id}）

llm:
  base_url: http://llama-cpp:8080/v1  # Docker 内部地址；OpenAI: https://api.openai.com/v1
  api_key: ""                          # 通过环境变量 COGNOS_LLM_API_KEY 设置
  model: qwen3-4b                      # LLM 模型名称
  max_tokens: 8192                     # 最大生成 Token 数
  timeout: 300s                        # LLM 调用超时

embedding:
  base_url: ""                             # 空则回退到 llm.base_url
  api_key: ""                               # 空则回退到 llm.api_key
  model: ""                                 # 必须通过环境变量或 LLM 配置指定
  dimension: 1024                           # 向量维度
  timeout: 300s                             # Embedding 调用超时

ai:
  chunk_size: 500             # 文档分块大小
  chunk_overlap: 100           # 分块重叠

search:                        # 深度搜索工具链（降级链：Exa → Tavily → DuckDuckGo 本地兜底）
  max_results: 5               # 搜索结果上限
  timeout: 10s                 # 搜索超时
  exa:
    api_key: ""                # Exa API Key（降级链首选，语义搜索 + highlights，效果最佳）
  tavily:
    api_key: ""                # Tavily API Key（降级链第二，Agent 优化型搜索）
  firecrawl:
    api_key: ""                # Firecrawl API Key（页面提取主力，JS 渲染 + 干净 Markdown）

rerank:
  enabled: true              # 是否启用 cross-encoder 重排序子进程
  python_path: "python"      # Python 解释器路径（Windows: python，Docker: python3）
  script_path: "rerank_server.py"  # rerank_server.py 路径（相对或绝对）

cors:
  allow_origins: "http://localhost:5173,http://localhost:3000"

parser:
  engine: mineru              # mineru（云端高精度）| local（纯 Go 本地库）
  mineru:
    api_key: ""                # 通过环境变量 MINERU_API_KEY 设置
    endpoint: "https://mineru.net/api/v4"  # MinerU Precise API 根路径
    timeout: 180s              # 轮询超时（大文档解析可能需要数分钟）
  python:
    path: "python3"            # 本地解析调用的 Python 解释器（Windows: python）

# 知识库
kb:
  max_upload_size: 51200       # 上传大小上限(KB)，51200 = 50MB

# 记忆系统（文件式存储 + 上下文压缩）
memory:
  storage_root: "storage/"          # 记忆+知识库存储根目录
  memory_max_lines: 200             # MEMORY.md 最大行数，超出合并旧条目
  compress_dedup: 0.70              # 去重清理触发阈值（token 占比）
  compress_compact: 0.85            # Autocompact 触发阈值（token 占比）
  ingest_poll_interval: 5s          # 异步队列轮询间隔
  ingest_lease_ttl: 60s             # 消费 lease TTL
