<!-- 概念 1：指挥中心（工业克制）
     色系：近黑 #0c0c0f 背板 + 锌灰线条 + 单一靛蓝点缀
     设计：同心弧 + 雷达扫描线 + 节点（运维监控仪表盘意象）
     去AI味：无渐变、无发光、无突触；纯线条 + 负空间 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 背板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0c0c0f"/>
  <!-- 外层同心弧（3/4 断口环，雷达感） -->
  <path d="M48 32 A16 16 0 1 1 32 16" stroke="#3f3f46" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 中层弧 -->
  <path d="M44 32 A12 12 0 1 1 32 20" stroke="#52525b" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- 内层弧 -->
  <path d="M40 32 A8 8 0 1 1 32 24" stroke="#71717a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 扫描线（靛蓝，单一点缀） -->
  <line x1="32" y1="32" x2="48" y2="32" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round"/>
  <!-- 扫描线末端节点 -->
  <circle cx="48" cy="32" r="2.5" fill="#5b5bd6"/>
  <!-- 外围断口节点（锌灰） -->
  <circle cx="32" cy="16" r="1.8" fill="#a1a1aa"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3" fill="#e4e4e7"/>
  <circle cx="32" cy="32" r="3" stroke="#52525b" stroke-width="0.8" fill="none"/>
  <!-- 底部刻度线（仪表盘细节） -->
  <g stroke="#3f3f46" stroke-width="1" stroke-linecap="round">
    <line x1="24" y1="50" x2="24" y2="46"/>
    <line x1="28" y1="51" x2="28" y2="47"/>
    <line x1="32" y1="52" x2="32" y2="48"/>
    <line x1="36" y1="51" x2="36" y2="47"/>
    <line x1="40" y1="50" x2="40" y2="46"/>
  </g>
</svg>
