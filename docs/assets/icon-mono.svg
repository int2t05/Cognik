<!-- OpsMind 单色 icon（深色背景用，纯白线条透明背板） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 外层同心弧（3/4 断口环） -->
  <path d="M48 32 A16 16 0 1 1 32 16" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- 中层弧 -->
  <path d="M44 32 A12 12 0 1 1 32 20" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- 内层弧 -->
  <path d="M40 32 A8 8 0 1 1 32 24" stroke="#ffffff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 扫描线 -->
  <line x1="32" y1="32" x2="48" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- 扫描线末端节点 -->
  <circle cx="48" cy="32" r="2.5" fill="#ffffff"/>
  <!-- 外围断口节点 -->
  <circle cx="32" cy="16" r="1.8" fill="#ffffff" fill-opacity="0.6"/>
  <!-- 中心点 -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <!-- 底部刻度线 -->
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="24" y1="50" x2="24" y2="46"/>
    <line x1="28" y1="51" x2="28" y2="47"/>
    <line x1="32" y1="52" x2="32" y2="48"/>
    <line x1="36" y1="51" x2="36" y2="47"/>
    <line x1="40" y1="50" x2="40" y2="46"/>
  </g>
</svg>
